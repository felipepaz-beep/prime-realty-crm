name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Tenta deploy no projeto do Lovable (ghgcnmzrsahfkgotiyuj).
      # Pode falhar se o token não tiver acesso — não bloqueia o pipeline.
      - name: Deploy evolution-webhook (ghgcnmzrsahfkgotiyuj)
        continue-on-error: true
        run: |
          supabase functions deploy evolution-webhook \
            --project-ref ghgcnmzrsahfkgotiyuj \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy evolution-webhook (btotxxumzkusjjiwwtxh)
        run: |
          supabase functions deploy evolution-webhook \
            --project-ref btotxxumzkusjjiwwtxh \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # google-calendar functions: tenta ghgcnmzrsahfkgotiyuj primeiro (onde o OAuth está configurado)
      - name: Deploy google-calendar-oauth (ghgcnmzrsahfkgotiyuj)
        continue-on-error: true
        run: |
          supabase functions deploy google-calendar-oauth \
            --project-ref ghgcnmzrsahfkgotiyuj \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy google-calendar-sync (ghgcnmzrsahfkgotiyuj)
        continue-on-error: true
        run: |
          supabase functions deploy google-calendar-sync \
            --project-ref ghgcnmzrsahfkgotiyuj \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy google-calendar-oauth (btotxxumzkusjjiwwtxh)
        run: |
          supabase functions deploy google-calendar-oauth \
            --project-ref btotxxumzkusjjiwwtxh \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy google-calendar-sync (btotxxumzkusjjiwwtxh)
        run: |
          supabase functions deploy google-calendar-sync \
            --project-ref btotxxumzkusjjiwwtxh \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
